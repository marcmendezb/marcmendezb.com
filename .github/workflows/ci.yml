name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow only reads the repo and runs checks: no deploys, no PR
# comments, no releases, so the default token gets no more than that.
permissions:
  contents: read

# Cancel an in-flight run when new commits land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Non-blocking: a dependency can carry an advisory with no upstream fix
      # yet (see README § Keeping dependencies patched), and failing the whole
      # pipeline on that is worse than not checking at all. This keeps the
      # result visible in the run log without turning main permanently red.
      - name: Dependency audit
        run: pnpm audit
        continue-on-error: true
